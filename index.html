<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Campeonato Amador</title>
<style>
:root{--bg:#0b1410;--card:#13211a;--card2:#192c22;--line:#25402f;--txt:#e9f4ee;--mut:#8fa99a;--ac:#2ee67a;--acd:#0b3d22;--warn:#ffcc33;--red:#ff5252;--blue:#4da3ff;--r:14px}
@media(prefers-color-scheme:light){:root{--bg:#eef4f0;--card:#fff;--card2:#f1f7f3;--line:#d3e2d9;--txt:#10241a;--mut:#5d7a69;--ac:#0f9d4f;--acd:#d6f3e2;--warn:#b57f00;--red:#d62d2d;--blue:#1769c9}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto}
#top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
#top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top button{background:none;border:0;color:var(--txt);font-size:22px;padding:4px 8px;border-radius:10px}
#main{flex:1;overflow-y:auto;padding:12px 14px 24px;-webkit-overflow-scrolling:touch}
#nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:21px;line-height:1}
#nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.tap{cursor:pointer}.card.tap:active{background:var(--card2)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 2px 8px}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:700}.c{text-align:center}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:11px 14px;border-radius:12px;font-size:15px;font-weight:600;width:100%}
.btn:active{filter:brightness(.9)}.btn.pri{background:var(--ac);color:#06210f;border-color:var(--ac)}.btn.dng{color:var(--red);border-color:var(--red);background:none}
.btn.sm{padding:7px 10px;font-size:13px;width:auto;border-radius:10px}.btn[disabled]{opacity:.4}
.bar{display:flex;gap:8px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:7px 12px;border-radius:99px;font-size:13px}
.chip.on{background:var(--ac);color:#06210f;border-color:var(--ac);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:9px 10px;font-size:14px;white-space:nowrap}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.badge.ok{background:var(--acd);color:var(--ac);border-color:transparent}.badge.y{background:#4a3b00;color:var(--warn);border-color:transparent}.badge.r{background:#4d1414;color:var(--red);border-color:transparent}
.badge.live{background:var(--red);color:#fff;border-color:transparent;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.25)}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty .big{font-size:44px}
label.f{display:block;margin:0 0 12px;font-size:13px;color:var(--mut)}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:5px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}.chk input{width:20px;height:20px;accent-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 3px;text-align:center}th{color:var(--mut);font-weight:600;font-size:11px}
td.t,th.t{text-align:left}tr+tr td{border-top:1px solid var(--line)}tr.q td:first-child{box-shadow:inset 3px 0 var(--ac)}
.match{display:flex;align-items:center;gap:8px;padding:12px}.match .tm{flex:1;min-width:0;display:flex;align-items:center;gap:6px}.match .tm.a{justify-content:flex-end;text-align:right}
.score{font-weight:800;font-size:18px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.sb{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;margin-bottom:12px}
.sb .tms{display:flex;align-items:center;justify-content:space-between;gap:6px}.sb .tms>div{flex:1;min-width:0}.sb .nm{font-weight:700;font-size:15px;word-break:break-word}
.sb .sc{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:6px}
.clock small{font-size:18px;color:var(--red);margin-left:6px}
.evb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.evb button{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:12px 0;font-size:22px}
.ev{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}.ev:last-child{border:0}.ev .m{width:46px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--mut);font-size:16px;padding:4px 8px}
#sheet-root{display:none;position:fixed;inset:0;z-index:50}#sheet-root.on{display:block}
.back{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;border:1px solid var(--line);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}
.sh-b{padding:14px 16px;overflow-y:auto;flex:1}.sh-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}#toast.on{opacity:1}
.live{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;overflow-y:auto}
.live .slot{font-size:30px;font-weight:900;text-align:center;padding:26px 8px;margin:10px 0;border:2px dashed var(--ac);border-radius:18px;min-height:96px;display:flex;align-items:center;justify-content:center;color:var(--ac)}
.gboard{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gboard .g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:70px}.gboard .g b{color:var(--ac);font-size:13px}
.gboard .g div{font-size:14px;padding:2px 0;animation:pop .3s}@keyframes pop{from{transform:scale(.6);opacity:0}}
.pill{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--card2);font-size:12px;font-weight:700;margin-right:4px}
.big-t{font-size:44px;font-weight:900;font-family:ui-monospace,Consolas,monospace;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
</style>
</head>
<body>
<div id="app"><header id="top"></header><main id="main"></main><nav id="nav"></nav></div>
<div id="sheet-root"></div><div id="toast"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
